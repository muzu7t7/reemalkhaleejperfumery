<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Genuine oud oil, oud wood and bakhoor from Cambodia, Assam, Laos, Vietnam and beyond, from Reem Al Khaleej Perfumes." />
    <meta name="theme-color" content="#f4eee3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Reem Al Khaleej Perfumes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@300..700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var mode = 'auto';
        try {
          var saved = localStorage.getItem('rk.theme');
          if (saved === 'light' || saved === 'dark') mode = saved;
        } catch (e) {}
        var dark = mode === 'auto' ? window.matchMedia('(prefers-color-scheme: dark)').matches : mode === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        var lang = (navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
        try {
          var sl = localStorage.getItem('rk.lang');
          if (sl === 'ar' || sl === 'en') lang = sl;
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
